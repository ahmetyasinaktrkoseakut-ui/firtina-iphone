name: Deploy iOS to App Store Connect

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload to App Store
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.3.app || sudo xcode-select -s /Applications/Xcode_15.2.app || sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: Inject GROQ API Key
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_KEY" ]; then
            sed -i '' "s/const GROQ_API_KEY = \".*\";/const GROQ_API_KEY = \"$GROQ_KEY\";/g" Firtina_AI/index.html || true
            sed -i '' "s/const GROQ_API_KEY = \".*\";/const GROQ_API_KEY = \"$GROQ_KEY\";/g" Firtina_iOS_Clean/index.html || true
            echo "Injected GROQ_API_KEY into index.html"
          fi

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>7GB34ALWCP</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Firtina_AI.xcodeproj \
            -scheme Firtina_AI \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Firtina_AI.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" \
            DEVELOPMENT_TEAM="7GB34ALWCP"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Firtina_AI.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8"

      - name: Upload IPA to App Store Connect
        run: |
          IPA_FILE=$(find build/output -name "*.ipa" | head -n 1)
          echo "Found IPA: $IPA_FILE"
          xcrun altool --upload-app --type ios --file "$IPA_FILE" \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"
